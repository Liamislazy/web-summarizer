<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Web Summarizer – Settings</title>
  <link rel="stylesheet" href="popup.css" />
  <style>
    body { width: auto; max-width: 560px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .field { margin: 18px 0; }
    .field label { display: block; font-weight: 600; margin-bottom: 4px; }
    .field input, .field select { width: 100%; padding: 7px 9px; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Web Summarizer settings</h1>
  <p class="hint">Everything is stored locally in this browser (chrome.storage.local).</p>

  <div class="field">
    <label for="apiKey">Anthropic API key</label>
    <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off" />
    <div class="hint">Get one at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>. It is only sent to api.anthropic.com.</div>
  </div>

  <div class="field">
    <label for="model">Model</label>
    <select id="model"></select>
  </div>

  <div class="field">
    <label for="maxPages">Max pages for "Whole website"</label>
    <input id="maxPages" type="number" min="2" max="50" />
    <div class="hint">The current page plus same-site links found on it. More pages = slower and more tokens.</div>
  </div>

  <div class="field">
    <label for="language">Summary language (optional)</label>
    <input id="language" type="text" placeholder="e.g. Vietnamese, English — blank = same as the page" />
  </div>

  <button id="save" class="primary" style="margin-left:0">Save</button>
  <span id="saved" class="hint" hidden>Saved ✓</span>

  <script src="settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
